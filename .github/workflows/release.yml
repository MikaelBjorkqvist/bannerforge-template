name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Tag must match config/mod.json version
        run: |
          VERSION=$(node -p "require('./config/mod.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match config version v$VERSION"; exit 1
          fi

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Check, type-check, build, package
        run: npm run release

      - name: Extract changelog section
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk "/^## \\[$VERSION\\]/{flag=1;next}/^## \\[/{flag=0}flag" CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Release $GITHUB_REF_NAME" > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.mcaddon --title "$GITHUB_REF_NAME" --notes-file release-notes.md
